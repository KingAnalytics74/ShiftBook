<!doctype html>
<html lang="en-GB">
<head>
<meta charset="utf-8">
<title>Shiftbuck community ad</title>
<style>
/* Community ad, 1080x1920: King's company is hiring and he posts in the Shiftbuck community; Toby sees it, messages him
   privately, gets the link to apply and applies.
   Same look as Tunde's story ad (story.html).
*/
@font-face{font-family:'Figtree';font-weight:500;src:url(../../../app/fonts/figtree-latin-500-normal.woff2) format('woff2')}
@font-face{font-family:'Figtree';font-weight:700;src:url(../../../app/fonts/figtree-latin-700-normal.woff2) format('woff2')}
@font-face{font-family:'Bricolage Grotesque';font-weight:700;src:url(../../../app/fonts/bricolage-grotesque-latin-700-normal.woff2) format('woff2')}
@font-face{font-family:'IBM Plex Mono';font-weight:600;src:url(../../../app/fonts/ibm-plex-mono-latin-600-normal.woff2) format('woff2')}
:root{--navy:#14213D;--navy2:#233A6E;--red:#C8102E;--sun:#FFD23F;--blue:#2563EB;--white:#FFFFFF;--mist:#C9D3EA;--ink:#14213D;
  --f-display:'Bricolage Grotesque',system-ui,sans-serif;--f-body:'Figtree',system-ui,sans-serif;--f-num:'IBM Plex Mono',monospace}
html,body{margin:0;background:#000}
#stage{position:relative;width:1080px;height:1920px;overflow:hidden;background:radial-gradient(120% 80% at 20% 0%,var(--navy2),var(--navy) 60%);font-family:var(--f-body);color:var(--white)}
.band{position:absolute;inset:0 0 auto 0;height:12px;background:linear-gradient(90deg,var(--blue) 0 33%,var(--sun) 33% 66%,var(--red) 66%);z-index:5}
.brand{position:absolute;left:70px;top:80px;display:flex;align-items:center;gap:22px;z-index:4}
.brand img{width:92px;height:92px;border-radius:24px;box-shadow:0 0 0 4px rgba(255,255,255,.9)}
.brand b{font-family:var(--f-display);font-size:58px;letter-spacing:-.01em}
.brand b span,.wm span,em{color:var(--sun);font-style:normal}
.scene{position:absolute;inset:0;opacity:0}
.head{position:absolute;left:70px;right:70px;top:250px;font-family:var(--f-display);font-weight:700;font-size:86px;line-height:1.05;letter-spacing:-.015em;text-wrap:balance}
.sub{position:absolute;left:70px;right:70px;font-size:42px;line-height:1.3;color:var(--mist);font-weight:500}
.frame{position:absolute;left:70px;width:940px;overflow:hidden;border-radius:40px;background:#EEF2F8;box-shadow:0 30px 80px rgba(0,0,0,.45),0 0 0 6px rgba(255,255,255,.08)}
.frame img{position:absolute;left:0;top:0;transform-origin:0 0}
.ring{position:absolute;border:9px solid var(--sun);border-radius:26px;opacity:0}
.who{position:absolute;right:70px;top:96px;display:flex;align-items:center;gap:14px;font-weight:700;font-size:34px;z-index:4}
.who svg{width:76px;height:76px;border-radius:50%;background:var(--sun)}
.art{position:absolute;left:0;top:0;width:1080px;height:1920px}
.counter{position:absolute;z-index:2;left:70px;right:70px;top:820px;background:var(--white);color:var(--ink);border-radius:40px;padding:56px 56px 60px;box-shadow:0 30px 80px rgba(0,0,0,.45)}
.counter .lbl{display:flex;align-items:center;gap:14px;font-family:var(--f-display);font-size:46px}
.counter .lbl i{width:22px;height:22px;border-radius:6px;background:#7C3AED;display:block}
.counter .amt{font-family:var(--f-num);font-weight:600;font-size:132px;letter-spacing:-.03em;margin:26px 0 8px}
.counter .mo{font-size:38px;color:#55607A;font-weight:600}
.counter .bar{height:34px;border-radius:999px;background:#EDE5FD;margin-top:40px;overflow:hidden}
.counter .bar i{display:block;height:100%;width:0;border-radius:999px;background:#7C3AED}
.counter .ticks{display:flex;justify-content:space-between;margin-top:16px;font-size:30px;color:#55607A;font-weight:600}
.coin{position:absolute;z-index:1;width:86px;height:86px;opacity:0}
.note{position:absolute;left:70px;right:70px;top:1560px;font-size:30px;color:var(--mist);text-align:center}
.end{text-align:center}
.end .logo{position:absolute;left:50%;top:420px;width:360px;height:360px;margin-left:-180px;border-radius:84px;box-shadow:0 0 0 8px rgba(255,255,255,.92),0 40px 90px rgba(0,0,0,.45)}
.wm{position:absolute;left:0;right:0;top:860px;font-family:var(--f-display);font-size:150px;letter-spacing:-.02em}
.tag{position:absolute;left:0;right:0;top:1060px;font-size:60px;font-weight:700}
.chip{position:absolute;left:50%;top:1200px;transform:translateX(-50%);background:var(--sun);color:var(--navy);font-weight:700;font-size:46px;padding:22px 44px;border-radius:999px;white-space:nowrap}
.url{position:absolute;left:0;right:0;top:1350px;font-family:var(--f-display);font-size:64px;letter-spacing:-.01em}
.small{position:absolute;left:90px;right:90px;top:1460px;font-size:28px;color:var(--mist);text-align:center;line-height:1.4}


.note2{position:absolute;left:70px;top:620px;background:var(--white);color:var(--ink);border-radius:30px;padding:24px 32px;font-size:40px;font-weight:700;box-shadow:0 20px 60px rgba(0,0,0,.4);display:flex;align-items:center;gap:16px}
.note2 i{width:22px;height:22px;border-radius:50%;background:#16A34A;display:block;flex:none}
.flist{position:absolute;left:70px;right:70px;top:560px;display:flex;flex-direction:column;gap:22px}
.feat{display:flex;align-items:center;gap:26px;background:rgba(255,255,255,.08);border:2px solid rgba(255,255,255,.14);border-radius:30px;padding:28px 32px;font-size:44px;font-weight:700;line-height:1.2}
.feat svg{width:72px;height:72px;flex:none}
.feat span small{display:block;font-size:32px;font-weight:500;color:var(--mist);margin-top:6px}
.safecard{position:absolute;left:70px;right:70px;top:620px;background:var(--sun);color:var(--navy);border-radius:40px;padding:56px 56px;box-shadow:0 30px 80px rgba(0,0,0,.45)}
.safecard b{display:block;font-family:var(--f-display);font-size:84px;line-height:1.05;letter-spacing:-.015em}
.safecard p{margin:24px 0 0;font-size:40px;line-height:1.35;font-weight:600}
</style>
</head>
<body>
<div id="stage"><div class="band"></div><div id="scenes"></div></div>
<script>
const CTA_URL = "shiftbuck.com";
const W = 940, LOGO = "../../../app/favicon.svg";
// two made-up people. King runs a small care company; Toby is a support worker
const KING = { skin: "#5A3825", skinD: "#472B1C", hair: "#1A1716", top: "#0F766E", beard: true, grey: true };
const TOBY = { skin: "#C98E6A", skinD: "#B07A58", hair: "#3B2A1E", top: "#0284C7", beard: false, grey: false };

// a person at 360x640. pose: "phone" | "wave" | "down"
function person(o, pose, t) {
  const blink = (t % 3.1) < 0.12 ? 0.1 : 1, wave = pose === "wave" ? Math.sin(t * 9) * 14 : 0;
  const arm = (rot, extra = "") => `<g transform="rotate(${rot} 268 250)"><rect x="252" y="236" width="40" height="92" rx="20" fill="${o.top}"/><rect x="256" y="312" width="32" height="96" rx="16" fill="${o.skin}"/>${extra}<circle cx="272" cy="414" r="21" fill="${o.skin}"/></g>`;
  const phone = `<g transform="translate(272 404) rotate(-34) translate(-30 -70)"><rect width="60" height="104" rx="11" fill="#14213D"/><rect x="6" y="9" width="48" height="82" rx="6" fill="#FFD23F"/><path d="M18 46 h24 M18 56 h16" stroke="#14213D" stroke-width="5" stroke-linecap="round"/></g>`;
  const right = pose === "phone" ? arm(34, phone) : pose === "wave" ? arm(-150 + wave) : arm(8);
  const hair = o.grey
    ? `<path d="M124 112 Q122 56 180 54 Q238 56 236 112 Q228 84 180 82 Q132 84 124 112 Z" fill="${o.hair}"/><path d="M134 92 Q150 74 166 70 M196 70 Q214 76 226 92" stroke="#9AA3B8" stroke-width="5" fill="none" stroke-linecap="round"/>`
    : `<path d="M122 118 Q116 50 182 46 Q246 50 238 118 Q230 78 200 74 Q170 92 136 86 Q126 98 122 118 Z" fill="${o.hair}"/>`;
  const beard = o.beard ? `<path d="M126 132 Q130 190 180 194 Q230 190 234 132 Q226 176 180 178 Q134 176 126 132 Z" fill="${o.hair}" opacity=".9"/>` : "";
  return `<svg viewBox="0 0 360 640" xmlns="http://www.w3.org/2000/svg">
    <rect x="118" y="470" width="54" height="150" rx="24" fill="#1D2433"/><rect x="188" y="470" width="54" height="150" rx="24" fill="#1D2433"/>
    <rect x="106" y="606" width="74" height="30" rx="15" fill="#0B0D12"/><rect x="180" y="606" width="74" height="30" rx="15" fill="#0B0D12"/>
    <g transform="rotate(-8 92 250)"><rect x="68" y="236" width="40" height="92" rx="20" fill="${o.top}"/><rect x="72" y="312" width="32" height="96" rx="16" fill="${o.skin}"/><circle cx="88" cy="414" r="20" fill="${o.skin}"/></g>
    <path d="M96 252 Q100 222 150 214 L210 214 Q260 222 264 252 L262 488 Q180 502 98 488 Z" fill="${o.top}"/>
    <path d="M150 214 L180 262 L210 214" fill="none" stroke="#FFFFFF" stroke-width="7" stroke-linejoin="round"/>
    <rect x="164" y="190" width="32" height="34" rx="10" fill="${o.skinD}"/>
    <path d="M142 222 L180 330 L218 222" fill="none" stroke="#FFD23F" stroke-width="7"/>
    <g transform="translate(150 324)"><rect width="62" height="80" rx="9" fill="#FFFFFF"/><rect width="62" height="16" rx="5" fill="#C8102E"/><circle cx="31" cy="38" r="11" fill="${o.skin}"/><rect x="12" y="56" width="38" height="6" rx="3" fill="#14213D"/></g>
    ${right}
    <ellipse cx="126" cy="128" rx="13" ry="18" fill="${o.skinD}"/><ellipse cx="234" cy="128" rx="13" ry="18" fill="${o.skinD}"/>
    <ellipse cx="180" cy="122" rx="56" ry="68" fill="${o.skin}"/>
    ${hair}${beard}
    <ellipse cx="158" cy="120" rx="7" ry="${8 * blink}" fill="#17151A"/><ellipse cx="202" cy="120" rx="7" ry="${8 * blink}" fill="#17151A"/>
    <path d="M146 100 Q158 94 168 100 M192 100 Q202 94 214 100" stroke="${o.hair}" stroke-width="5" fill="none" stroke-linecap="round"/>
    <path d="M160 152 Q180 168 200 152" stroke="#FFFFFF" stroke-width="7" fill="none" stroke-linecap="round"/>
  </svg>`;
}
const avatar = o => `<svg viewBox="80 30 200 210" xmlns="http://www.w3.org/2000/svg"><rect x="80" y="30" width="200" height="210" fill="#FFD23F"/>` +
  person(o, "down", 0).replace(/^<svg[^>]*>/, "").replace(/<\/svg>$/, "") + `</svg>`;
const icon = { mask: `<svg viewBox="0 0 72 72"><circle cx="36" cy="36" r="36" fill="#FFD23F"/><path d="M18 30 q18 -14 36 0 v6 q-18 16 -36 0 z" fill="#14213D"/><circle cx="28" cy="33" r="4" fill="#FFD23F"/><circle cx="44" cy="33" r="4" fill="#FFD23F"/></svg>`,
  pin: `<svg viewBox="0 0 72 72"><circle cx="36" cy="36" r="36" fill="#FFD23F"/><path d="M36 16 a13 13 0 0 1 13 13 c0 10 -13 25 -13 25 s-13 -15 -13 -25 a13 13 0 0 1 13 -13z" fill="#14213D"/><circle cx="36" cy="29" r="5" fill="#FFD23F"/></svg>`,
  chat: `<svg viewBox="0 0 72 72"><circle cx="36" cy="36" r="36" fill="#FFD23F"/><path d="M18 22 h36 a5 5 0 0 1 5 5 v16 a5 5 0 0 1 -5 5 h-20 l-10 8 v-8 h-6 a5 5 0 0 1 -5 -5 v-16 a5 5 0 0 1 5 -5z" fill="#14213D"/></svg>`,
  shield: `<svg viewBox="0 0 72 72"><circle cx="36" cy="36" r="36" fill="#FFD23F"/><path d="M36 14 l18 7 v13 c0 12 -8 20 -18 24 c-10 -4 -18 -12 -18 -24 v-13 z" fill="#14213D"/><path d="M28 36 l6 6 l11 -12" stroke="#FFD23F" stroke-width="5" fill="none" stroke-linecap="round" stroke-linejoin="round"/></svg>` };

// screens: the real app, signed in as Toby against a stand-in back end (mock-supabase-community.js, capture-community.js)
const C = "screens/community/";
const SCENES = [
  { kind: "post", t: [0, 3.8], head: "King's company<br><em>is hiring.</em>" },
  { kind: "app", t: [3.8, 7.6], who: TOBY, name: "Toby", head: "Toby sees<br><em>King's post.</em>", sub: "In the Shiftbuck carers' community.",
    imgs: [{ src: C + "post.png", iw: 1074, win: [0, 477], rings: [{ x: 30, y: 200, w: 1010, h: 200, at: 5.0 }] }] },
  { kind: "app", t: [7.6, 11.4], who: TOBY, name: "Toby", head: "He messages King<br><em>privately.</em>", sub: "Only the two of them can read it.",
    imgs: [{ src: C + "thread.png", iw: 972, win: [90, 640], pad: 30, rings: [{ x: 0, y: 160, w: 650, h: 100, at: 8.8 }] }] },
  { kind: "app", t: [11.4, 15.0], who: TOBY, name: "Toby", head: "King sends<br><em>the link to apply.</em>", sub: "Straight from the company that's hiring.",
    imgs: [{ src: C + "thread.png", iw: 972, win: [640, 1270], pad: 30, rings: [{ x: 160, y: 790, w: 500, h: 60, at: 12.4 }] }] },
  { kind: "apply", t: [15.0, 19.2], head: "Toby applies<br><em>that same night.</em>" },
  { kind: "feats", t: [19.2, 23.6], head: "The Shiftbuck<br><em>carers' community.</em>" },
  { kind: "safe", t: [23.6, 26.0], head: "Stay safe." },
  { kind: "end", t: [26.0, 29.5] }
];

const ease = x => x < 0 ? 0 : x > 1 ? 1 : x < .5 ? 4 * x * x * x : 1 - Math.pow(-2 * x + 2, 3) / 2;
const out = x => x < 0 ? 0 : x > 1 ? 1 : 1 - Math.pow(1 - x, 3);
const brand = `<div class="brand"><img src="${LOGO}" alt=""><b>Shift<span>buck</span></b></div>`;
const root = document.getElementById("scenes");
const els = SCENES.map(s => {
  const el = document.createElement("div"); el.className = "scene " + s.kind;
  if (s.kind === "post") el.innerHTML = `${brand}<div class="head">${s.head}</div>
    <div class="note2"><i></i>Posted in the carers' community</div>
    <div class="art" data-p="king" style="left:250px;top:780px;width:560px;height:996px"></div>`;
  if (s.kind === "app") {
    el.innerHTML = `${brand}<div class="who">${avatar(s.who)}<span>${s.name}</span></div><div class="head">${s.head}</div><div class="sub">${s.sub}</div>` +
      s.imgs.map(im => { const pad = im.pad || 0, sc = W / (im.iw + 2 * pad);
        im.sc = sc; im.pd = pad * sc; im.h = Math.round((im.win[1] - im.win[0]) * sc + 2 * im.pd);
        return `<div class="frame" style="width:${W}px;left:70px;height:${im.h}px;background:#FFFFFF"><img src="${im.src}" style="width:${im.iw}px;transform:scale(${sc});left:${im.pd}px;top:${im.pd - im.win[0] * sc}px">${(im.rings || []).map(() => `<div class="ring"></div>`).join("")}</div>`; }).join("");
  }
  if (s.kind === "apply") el.innerHTML = `${brand}<div class="head">${s.head}</div>
    <div class="note2"><i></i>Application sent</div>
    <div class="art" data-p="toby" style="left:250px;top:780px;width:560px;height:996px"></div>
    <div class="note" style="top:1740px">Dramatisation. King, Toby and the company are made up.</div>`;
  if (s.kind === "feats") el.innerHTML = `${brand}<div class="head">${s.head}</div><div class="flist">
    <div class="feat">${icon.mask}<span>Nicknames only<small>Nobody sees your name or where you work</small></span></div>
    <div class="feat">${icon.pin}<span>Near me<small>Carers in your area</small></span></div>
    <div class="feat">${icon.chat}<span>Pay, rights, rest and meet-ups<small>Spaces for each, plus private messages</small></span></div>
    <div class="feat">${icon.shield}<span>Report and block<small>Moderated, with house rules</small></span></div></div>`;
  if (s.kind === "safe") el.innerHTML = `${brand}<div class="head">${s.head}</div>
    <div class="safecard"><b>Real jobs never ask you to pay.</b><p>Never pay for a job, training or visa sponsorship. Check the company yourself, and report anything that worries you.</p></div>`;
  if (s.kind === "end") el.innerHTML = `<img class="logo" src="${LOGO}" alt=""><div class="wm">Shift<span>buck</span></div><div class="tag">Talk to carers near you</div>
    <div class="chip">Free for UK care workers</div><div class="url">${CTA_URL}</div>
    <div class="small">Dramatisation. Names, posts and messages are made up.</div>`;
  root.appendChild(el); return el;
});
function layout() {
  SCENES.forEach((s, i) => {
    if (s.kind !== "app") return;
    const el = els[i], head = el.querySelector(".head"), sub = el.querySelector(".sub");
    const subTop = 250 + head.offsetHeight + 34; sub.style.top = subTop + "px";
    let y = subTop + sub.offsetHeight + 56;
    el.querySelectorAll(".frame").forEach((f, j) => { f.style.top = y + "px"; y += s.imgs[j].h + 30; });
  });
}
window.DURATION = SCENES[SCENES.length - 1].t[1];
window.renderAt = t => {
  SCENES.forEach((s, i) => {
    const el = els[i], [a, b] = s.t, k = t - a, inT = out(k / .45), outT = i === SCENES.length - 1 ? 1 : 1 - ease((t - (b - .3)) / .3);
    const vis = t >= a - .01 && t <= b + .01;
    el.style.opacity = vis ? Math.min(inT, outT) : 0;
    if (!vis) return;
    const head = el.querySelector(".head"); if (head) head.style.transform = `translateY(${(1 - inT) * 50}px)`;
    el.querySelectorAll("[data-p]").forEach(d => {
      d.innerHTML = person(d.dataset.p === "king" ? KING : TOBY, "phone", k);
      d.style.transform = `translateY(${(1 - out((k - .1) / .6)) * 160 + Math.sin(k * 2.2) * 6}px)`;
    });
    const n2 = el.querySelector(".note2"); if (n2) { n2.style.opacity = out((k - .7) / .35); n2.style.transform = `scale(${.85 + .15 * out((k - .7) / .35)})`; }
    if (s.kind === "app") {
      el.querySelectorAll(".frame").forEach((f, j) => {
        f.style.opacity = out((k - .1) / .4); f.style.transform = `translateY(${(1 - out((k - .1) / .5)) * 120}px)`;
        const im = s.imgs[j];
        (im.rings || []).forEach((r, n) => {
          const ring = f.querySelectorAll(".ring")[n], rk = t - r.at, pad = 12 / im.sc;
          ring.style.left = `${im.pd + (r.x - pad) * im.sc}px`; ring.style.top = `${im.pd + (r.y - pad - im.win[0]) * im.sc}px`;
          ring.style.width = `${(r.w + pad * 2) * im.sc}px`; ring.style.height = `${(r.h + pad * 2) * im.sc}px`;
          ring.style.opacity = out(rk / .25); ring.style.transform = `scale(${rk < 0 ? 1.15 : 1.15 - .15 * out(rk / .3)})`;
        });
      });
      el.querySelector(".sub").style.opacity = out((k - .25) / .4);
      el.querySelector(".who").style.opacity = out((k - .2) / .4);
    }
    if (s.kind === "apply") el.querySelector(".note").style.opacity = out((k - .6) / .4);
    if (s.kind === "feats") el.querySelectorAll(".feat").forEach((f, n) => { const kk = out((k - .3 - n * .35) / .4); f.style.opacity = kk; f.style.transform = `translateX(${(1 - kk) * 80}px)`; });
    if (s.kind === "safe") { const sf = el.querySelector(".safecard"); sf.style.opacity = out((k - .1) / .4); sf.style.transform = `scale(${.9 + .1 * out((k - .1) / .4)})`; }
    if (s.kind === "end") {
      const logo = el.querySelector(".logo");
      logo.style.transform = `scale(${.6 + .4 * out(k / .5)}) rotate(${(1 - out(k / .6)) * -20}deg)`;
      [".wm", ".tag", ".url", ".small"].forEach((sel, n) => { const e = el.querySelector(sel); e.style.opacity = out((k - .25 - n * .15) / .4); e.style.transform = `translateY(${(1 - out((k - .25 - n * .15) / .4)) * 30}px)`; });
      const chip = el.querySelector(".chip"), kc = out((k - .6) / .4);
      chip.style.opacity = kc; chip.style.transform = `translateX(-50%) scale(${.85 + .15 * kc + .025 * Math.sin(Math.max(0, k - 1.2) * 5)})`;
    }
  });
};
window.ready = Promise.all([document.fonts.ready, ...[...document.images].map(i => i.decode().catch(() => {}))]).then(() => { layout(); renderAt(0); return true; });
</script>
</body>
</html>
